<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub | Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header>
    <div class="logo">
      <a href="index.html" aria-label="StudentHub home">StudentHub</a>
    </div>
    <nav aria-label="Primary">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html" aria-current="page">Register</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <section aria-labelledby="register-heading">
      <h1 id="register-heading">Create your account</h1>

      <form action="#" method="post" novalidate>
        <fieldset>
          <legend>Account details</legend>

          <div class="form-group">
            <label for="fullname">Full name</label>
            <input type="text" id="fullname" name="fullname" autocomplete="name" required>
          </div>

          <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" required>
              <option value="">Select role</option>
              <option value="student">Student</option>
              <option value="faculty">Faculty</option>
            </select>
          </div>

          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required minlength="8">
          </div>

          <div class="form-group checkbox">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions</label>
          </div>
        </fieldset>

        <button type="submit">Create account</button>
      </form>

      <p>Already have an account? <a href="login.html">Login here</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 StudentHub. All rights reserved.</p>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
