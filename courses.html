<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub | Courses</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header>
    <div class="logo">
      <a href="index.html" aria-label="StudentHub home">StudentHub</a>
    </div>
    <div class="account-actions">
      <a href="profile.html">Profile</a>
      <a href="login.html">Logout</a>
    </div>
  </header>

  <div class="app-layout">
    <nav aria-label="App navigation" class="sidebar">
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="courses.html" aria-current="page">Courses</a></li>
        <li><a href="attendance.html">Attendance</a></li>
        <li><a href="assignments.html">Assignments</a></li>
        <li><a href="grades.html">Grades</a></li>
      <li><a href="index.html">Home</a></li>
        
      
      </ul>
    </nav>

    <main id="main-content">
      <h1>Courses</h1>

      <form action="#" method="get" role="search" aria-label="Filter courses">
        <div class="form-group">
          <label for="search-course">Search courses</label>
          <input type="search" id="search-course" name="q">
        </div>
        <div class="form-group">
          <label for="filter-semester">Semester</label>
          <select id="filter-semester" name="semester">
            <option value="">All</option>
          </select>
        </div>
        <div class="form-group">
          <label for="filter-department">Department</label>
          <select id="filter-department" name="department">
            <option value="">All</option>
          </select>
        </div>
        <button type="submit">Apply filters</button>
      </form>

      <section aria-labelledby="course-list-heading">
        <h2 id="course-list-heading" class="visually-hidden">Course list</h2>
        <ul class="course-grid" id="course-list">
          <li>
            <article>
              <h3>Course title</h3>
              <p>Course code / credits</p>
              <a href="#" class="view-course">View details</a>
            </article>
          </li>
        </ul>
      </section>
    </main>
  </div>

  <footer>
    <p>&copy; 2026 StudentHub. All rights reserved.</p>
  </footer>

  <script src="js/main.js" defer></script>
  <script src="js/Student.js" defer></script>
  
</body>
</html>
